
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NORMS MANAGEMENT - QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #202938;
    }

    header {
      background: #151d32;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h2 {
      margin: 0;
      font-size: 21px;
    }

    header p {
      margin: 7px 0 0;
      font-size: 12px;
      color: #cbd5e1;
    }

    .container {
      max-width: 550px;
      margin: 20px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 12px #0000000c;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select, button {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 10px;
    }

    select {
      border: 1px solid #ccd3df;
      background: white;
    }

    button {
      border: 0;
      cursor: pointer;
      font-weight: bold;
      color: white;
      background: #1e40af;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .stop {
      background: #dc2626;
    }

    .confirm {
      background: #15803d;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      background: #eef2ff;
      margin-top: 12px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .participant {
      line-height: 1.8;
      font-size: 14px;
    }

    .participant strong {
      color: #111827;
    }

    .hidden {
      display: none;
    }

    .history-item {
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
      font-size: 13px;
    }

    .small {
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>

<body>

<header>
  <h2>NORMS MANAGEMENT</h2>
  <p>EVENT QR ENTRY SCANNER</p>
</header>

<div class="container">

  <div class="card">
    <label>Select Event</label>
    <select id="eventSelect" disabled>
      <option value="">Connecting to event system...</option>
    </select>

    <div id="connectionStatus" class="status">
      Waiting for Google Apps Script connection...
    </div>
  </div>

  <div class="card">
    <label>QR Code Scanner</label>

    <div id="reader"></div>

    <button id="startBtn" onclick="startScanner()" disabled>
      START CAMERA SCANNER
    </button>

    <button id="stopBtn" class="stop" onclick="stopScanner()" disabled>
      STOP SCANNER
    </button>

    <div id="scanStatus" class="status">
      Select an event and start scanning.
    </div>
  </div>

  <div class="card hidden" id="participantCard">
    <h3>Participant Verification</h3>

    <div id="participantDetails" class="participant"></div>

    <button id="confirmBtn" class="confirm" onclick="confirmEntry()">
      CONFIRM CHECK-IN
    </button>

    <button onclick="resetScan()">
      SCAN NEXT PARTICIPANT
    </button>
  </div>

  <div class="card">
    <h3>Recent Check-ins</h3>

    <button onclick="loadHistory()">REFRESH HISTORY</button>

    <div id="history">
      <p class="small">No history loaded.</p>
    </div>
  </div>

</div>

<script>
/*********************************************************
 * NORMS EXTERNAL QR SCANNER
 * Communicates with authenticated Google Apps Script
 *********************************************************/

let scanner = null;
let scannerRunning = false;
let busy = false;

let nonce = new URLSearchParams(location.search).get("n");

let currentPass = null;
let currentEvent = null;
let connected = false;
let eventsLoaded = false;
let parentOrigin = null;

const eventSelect = document.getElementById("eventSelect");

function setStatus(message, type = "") {
  const el = document.getElementById("scanStatus");
  el.className = "status " + type;
  el.textContent = message;
}

function setConnection(message, type = "") {
  const el = document.getElementById("connectionStatus");
  el.className = "status " + type;
  el.textContent = message;
}

function sendToParent(type, data = {}) {
  if (!window.opener || !parentOrigin || !nonce) {
    setConnection("Google Apps Script connection is unavailable.", "error");
    return;
  }

  window.opener.postMessage({
    app: "NORMS_EXTERNAL_SCANNER",
    type: type,
    nonce: nonce,
    ...data
  }, parentOrigin);
}

/*********************************************************
 * RECEIVE MESSAGES FROM GOOGLE APPS SCRIPT
 *********************************************************/

window.addEventListener("message", function(event) {

  if (!parentOrigin || event.origin !== parentOrigin) return;
  if (event.source !== window.opener) return;

  const data = event.data || {};

  if (data.app !== "NORMS_EVENT_PARENT") return;
  if (data.nonce !== nonce) return;

  switch (data.type) {

    case "INIT":
      connected = true;
      eventsLoaded = true;
      loadEvents(data.events || []);
      setConnection("Connected to NORMS Event Management.", "success");
      document.getElementById("startBtn").disabled = false;
      break;

    case "VALIDATION_RESULT":
      handleValidation(data.response);
      break;

    case "CHECKIN_RESULT":
      handleCheckin(data.response);
      break;

    case "HISTORY_RESULT":
      renderHistory(data.records || []);
      break;

    case "PARENT_ERROR":
      setStatus(data.message || "Application error.", "error");
      busy = false;
      break;
  }
});

/*********************************************************
 * EVENT LIST
 *********************************************************/

function loadEvents(events) {

  eventSelect.innerHTML = "";

  if (!events.length) {
    eventSelect.innerHTML =
      '<option value="">No active events available</option>';
    eventSelect.disabled = true;
    return;
  }

  eventSelect.disabled = false;

  events.forEach(function(event) {
    const option = document.createElement("option");
    option.value = event.eventId;
    option.textContent = event.eventName;
    eventSelect.appendChild(option);
  });

  currentEvent = eventSelect.value;
}

eventSelect.addEventListener("change", function() {
  currentEvent = this.value;
  resetScan();
  loadHistory();
});

/*********************************************************
 * START CAMERA
 *********************************************************/

async function startScanner() {

  if (!connected || !eventsLoaded) {
    setStatus("Not connected to the event management system.", "error");
    return;
  }

  if (!currentEvent) {
    setStatus("Please select an event.", "error");
    return;
  }

  if (scannerRunning) return;

  try {

    if (!scanner) {
      scanner = new Html5Qrcode("reader");
    }

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 240, height: 240 }
      },
      onScanSuccess,
      function() {}
    );

    scannerRunning = true;

    document.getElementById("startBtn").disabled = true;
    document.getElementById("stopBtn").disabled = false;

    setStatus("Camera started. Scan participant QR pass.");

  } catch (error) {

    setStatus(
      "Camera access failed: " + error,
      "error"
    );

  }
}

/*********************************************************
 * STOP CAMERA
 *********************************************************/

async function stopScanner() {

  if (!scanner || !scannerRunning) return;

  try {
    await scanner.stop();
    scannerRunning = false;

    document.getElementById("startBtn").disabled = false;
    document.getElementById("stopBtn").disabled = true;

    setStatus("Scanner stopped.");

  } catch (error) {
    setStatus("Unable to stop scanner: " + error, "error");
  }
}

/*********************************************************
 * QR CODE RESULT
 *********************************************************/

function extractToken(value) {

  try {
    const url = new URL(value);
    return url.searchParams.get("token") || value;
  } catch (error) {
    return value.trim();
  }

}

async function onScanSuccess(decodedText) {

  if (busy || currentPass) return;

  busy = true;

  setStatus("QR detected. Verifying participant...");

  const qrToken = extractToken(decodedText);

  sendToParent("VALIDATE_QR", {
    eventId: currentEvent,
    qrToken: qrToken
  });

}

/*********************************************************
 * PARTICIPANT VALIDATION
 *********************************************************/

function handleValidation(response) {

  busy = false;

  if (!response || response.success !== true) {

    setStatus(
      response?.message || "Invalid QR code.",
      "error"
    );

    return;
  }

  currentPass = response.pass || response;

  const participant = response.participant || {};

  document.getElementById("participantCard")
    .classList.remove("hidden");

  document.getElementById("participantDetails").innerHTML = `
    <strong>Name:</strong> ${safe(participant.name)}<br>
    <strong>Organization:</strong> ${safe(participant.organization)}<br>
    <strong>Designation:</strong> ${safe(participant.designation)}<br>
    <strong>Mobile:</strong> ${safe(participant.mobile)}<br>
    <strong>Email:</strong> ${safe(participant.email)}<br>
    <strong>Pass ID:</strong> ${safe(currentPass.passId || participant.passId)}
  `;

  document.getElementById("confirmBtn").disabled = false;

  setStatus("Participant verified. Confirm entry.", "success");

}

/*********************************************************
 * CONFIRM CHECK-IN
 *********************************************************/

function confirmEntry() {

  if (!currentPass || !currentEvent) return;

  document.getElementById("confirmBtn").disabled = true;

  setStatus("Confirming participant entry...");

  sendToParent("CONFIRM_CHECKIN", {
    eventId: currentEvent,
    passId: currentPass.passId,
    qrToken: currentPass.qrToken,
    deviceInfo: navigator.userAgent
  });

}

function handleCheckin(response) {

  if (response && response.success) {

    setStatus(
      response.message || "Entry confirmed successfully.",
      "success"
    );

    loadHistory();

    currentPass = null;

    document.getElementById("participantCard")
      .classList.add("hidden");

  } else {

    setStatus(
      response?.message || "Check-in failed.",
      "error"
    );

    document.getElementById("confirmBtn").disabled = false;
  }

}

/*********************************************************
 * RESET SCAN
 *********************************************************/

function resetScan() {

  currentPass = null;
  busy = false;

  document.getElementById("participantCard")
    .classList.add("hidden");

  document.getElementById("confirmBtn").disabled = false;

  setStatus("Ready to scan the next participant.");

}

/*********************************************************
 * RECENT HISTORY
 *********************************************************/

function loadHistory() {

  if (!connected || !currentEvent) return;

  sendToParent("LOAD_HISTORY", {
    eventId: currentEvent
  });

}

function renderHistory(records) {

  const history = document.getElementById("history");

  if (!records.length) {
    history.innerHTML = "<p>No check-ins found.</p>";
    return;
  }

  history.innerHTML = "";

  records.forEach(function(item) {

    const div = document.createElement("div");
    div.className = "history-item";

    const name = document.createElement("strong");
    name.textContent = item.name || "Unknown participant";

    const details = document.createElement("div");
    details.className = "small";
    details.textContent =
      (item.organization || "") + " | " +
      (item.time || "");

    div.appendChild(name);
    div.appendChild(details);
    history.appendChild(div);

  });

}

/*********************************************************
 * SAFE TEXT
 *********************************************************/

function safe(value) {

  const element = document.createElement("span");
  element.textContent = value || "-";

  return element.innerHTML;

}

/*********************************************************
 * CONNECT TO PARENT APPLICATION
 *********************************************************/

function initializeConnection() {

  if (!window.opener) {
    setConnection(
      "Please open this scanner from the authenticated Google Apps Script application.",
      "error"
    );
    return;
  }

  if (!nonce) {
    setConnection("Scanner security key is missing.", "error");
    return;
  }

  // Obtain the trusted parent origin from the opener.
  // The parent must explicitly send its origin before INIT.
  // Parent bridge should send messages to this scanner using
  // the exact deployed Vercel origin.

  setConnection("Waiting for Google Apps Script connection...");

  sendReadyToParent();

}

function sendReadyToParent() {

  // The parent origin must be configured to the actual
  // Apps Script web app origin, not guessed.
  const configuredParentOrigin =
    "https://script.google.com";

  parentOrigin = configuredParentOrigin;

  window.opener.postMessage({
    app: "NORMS_EXTERNAL_SCANNER",
    type: "SCANNER_READY",
    nonce: nonce
  }, parentOrigin);

}

initializeConnection();

</script>

</body>
</html>
